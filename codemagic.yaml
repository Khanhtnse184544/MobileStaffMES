workflows:
  android-release:
    name: Android Release APK

    environment:
      node: 20

      android_signing:
        - expo-release-key

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Expo prebuild
        script: |
          npx expo prebuild

      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
